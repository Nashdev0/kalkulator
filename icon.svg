<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer App Icon Background -->
  <rect width="100" height="100" rx="22" fill="#D8B4FE" />
  <rect x="8" y="8" width="84" height="84" rx="16" fill="none" stroke="#582C83" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Calculator Base / Case -->
  <rect x="18" y="16" width="64" height="68" rx="12" fill="#FBCFE8" stroke="#582C83" stroke-width="3" />
  
  <!-- Screen Area -->
  <rect x="26" y="24" width="48" height="18" rx="6" fill="#F3E8FF" stroke="#582C83" stroke-width="3" />
  <text x="68" y="38" font-family="'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="end" fill="#582C83">8008</text>
  
  <!-- Keypad Area -->
  
  <!-- Top row (AC, Operators) -->
  <rect x="26" y="48" width="10" height="8" rx="4" fill="#F9A8D4" stroke="#582C83" stroke-width="2" />
  <rect x="39" y="48" width="10" height="8" rx="4" fill="#D8B4FE" stroke="#582C83" stroke-width="2" />
  <rect x="52" y="48" width="10" height="8" rx="4" fill="#D8B4FE" stroke="#582C83" stroke-width="2" />
  <rect x="65" y="48" width="10" height="8" rx="4" fill="#D8B4FE" stroke="#582C83" stroke-width="2" />
  
  <!-- Mid row (Numbers, Operators) -->
  <rect x="26" y="60" width="10" height="8" rx="4" fill="#fff" stroke="#582C83" stroke-width="2" />
  <rect x="39" y="60" width="10" height="8" rx="4" fill="#fff" stroke="#582C83" stroke-width="2" />
  <rect x="52" y="60" width="10" height="8" rx="4" fill="#fff" stroke="#582C83" stroke-width="2" />
  <rect x="65" y="60" width="10" height="8" rx="4" fill="#D8B4FE" stroke="#582C83" stroke-width="2" />
  
  <!-- Bottom row (Numbers, Equals) -->
  <rect x="26" y="72" width="10" height="8" rx="4" fill="#fff" stroke="#582C83" stroke-width="2" />
  <rect x="39" y="72" width="10" height="8" rx="4" fill="#fff" stroke="#582C83" stroke-width="2" />
  <rect x="52" y="72" width="10" height="8" rx="4" fill="#fff" stroke="#582C83" stroke-width="2" />
  <!-- Equals button highlighted -->
  <rect x="65" y="72" width="10" height="8" rx="4" fill="#582C83" stroke="#582C83" stroke-width="2" />
  <!-- Simple = symbol on the button -->
  <line x1="68" y1="75" x2="72" y2="75" stroke="#F3E8FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="77" x2="72" y2="77" stroke="#F3E8FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Aesthetic Details -->
  <!-- A floating sparkle/star -->
  <path d="M 10 30 Q 15 30 15 25 Q 15 30 20 30 Q 15 30 15 35 Q 15 30 10 30 Z" fill="#fff" stroke="#582C83" stroke-width="1.5" />
  
  <!-- A tiny heart sticking out of the calculator -->
  <path d="M 77 15 C 77 12, 81 12, 81 16 C 81 18, 77 21, 77 21 C 77 21, 73 18, 73 16 C 73 12, 77 12, 77 15 Z" fill="#F9A8D4" stroke="#582C83" stroke-width="1.5" />
</svg>
